version: "3.8"

services:
  backend:
    build: ./backend
    container_name: triple-a-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triple-a-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped