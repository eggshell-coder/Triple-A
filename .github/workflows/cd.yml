name: CD

# Vercel Git integration owns production deployments. This workflow must not
# deploy to Render or GitHub Pages; it only smoke-tests the Vercel production
# frontend/API after the CI run for the exact main-branch commit succeeds.
concurrency:
  group: cd-production
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-smoke-test:
    name: Verify Vercel production
    runs-on: ubuntu-latest
    # workflow_run also fires for PR CI. Only trust successful CI runs caused
    # by a push to main; never treat PR or manual/tag runs as production gates.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Wait for Vercel production API and Supabase health
        env:
          API_HEALTH_URL: https://triple-a-six.vercel.app/health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            response="$(curl --silent --show-error --max-time 15 "$API_HEALTH_URL" || true)"
            if RESPONSE="$response" node -e '
              try {
                const body = JSON.parse(process.env.RESPONSE || "{}");
                if (body.success === true && body.db === "ok") process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "Production API and Supabase health check passed."
              exit 0
            fi
            echo "API/Supabase not ready (attempt $i/30); retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Production API or Supabase health check failed."
          exit 1

      - name: Wait for Vercel production storefront
        env:
          FRONTEND_URL: https://triple-a-store.vercel.app/
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$FRONTEND_URL" || true)"
            case "$code" in
              200) echo "Production storefront returned HTTP 200."; exit 0 ;;
            esac
            echo "Storefront not ready (attempt $i/30; HTTP $code); retrying in 10 seconds."
            sleep 10
          done
          echo "::error::Production storefront did not return HTTP 200."
          exit 1
