name: CD

# Deploy only after CI passed on the same commit. Needs both checks green.
concurrency:
  group: cd-production
  # Never cancel a deploy that is already rolling out — that can leave the
  # service in a half-deployed state. Unlike CI, this queue must drain.
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy API
    runs-on: ubuntu-latest

    # Only deploy if CI concluded successfully.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production
      url: https://triple-a-gkpq.onrender.com

    steps:
      - uses: actions/checkout@v4

      # Fires Render's deploy hook. The build happens on Render, not here,
      # so this job stays fast and the secrets never enter this repo.
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              https://triple-a-gkpq.onrender.com/health || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time"
          exit 1

  deploy-frontend:
    name: Deploy web app
    runs-on: ubuntu-latest
    needs: deploy-backend

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      startsWith(github.ref, 'refs/tags/v')

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with ci.yml — anything below 3.27 breaks on
          # Color.withValues().
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: frontend

      # The API base URL is injected at build time, so switching between
      # staging and production never requires a code change.
      - name: Build web
        working-directory: frontend
        run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.PRODUCTION_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web